name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          # Add these back when other platforms are needed:
          # - { os: macos-latest,   name: macOS }
          # - { os: ubuntu-22.04,   name: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -path "*_artefacts/Release/VST3/*.vst3" -maxdepth 5 -exec cp -R {} out/ \;
          find build -path "*_artefacts/Release/AU/*.component" -maxdepth 5 -exec cp -R {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ChaosGrain-${{ matrix.name }}
          path: out
